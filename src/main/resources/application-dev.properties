# Local development defaults. Activate with SPRING_PROFILES_ACTIVE=dev (or
# --spring.profiles.active=dev). Never reuse these values in staging/production.

spring.datasource.url=jdbc:postgresql://localhost:5432/base_project_spring_boot
spring.datasource.username=postgres
spring.datasource.password=postgres

# DEV-ONLY secret, generated with `openssl rand -base64 32`. Never reuse in staging/production.
app.jwt.secret=8WLisVqnzjV+IvCmkuoANI/0xXsTsqGhlM/VYUqRdes=
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d
app.jwt.mfa-token-expiration=5m
app.jwt.issuer=base-project-spring-boot

app.cors.allowed-origins=http://localhost:3000

# --- Email verification ---
app.email-verification.verification-base-url=http://localhost:3000/verify-email
app.email-verification.token-expiration=24h

# --- Outbound mail ---
# No spring.mail.* configured on purpose: the "dev" profile uses LoggingEmailSender instead of real
# SMTP, so verification/2FA-adjacent links are just printed to the console. app.mail.from-address is
# still required (validated at startup) even though LoggingEmailSender doesn't send anything with it.
app.mail.from-address=dev@localhost

# --- Google OAuth2 login ---
# Create OAuth 2.0 credentials at https://console.cloud.google.com/apis/credentials
# (Web application; authorized redirect URI: http://localhost:8080/login/oauth2/code/google),
# then export GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET or replace the placeholders below directly for
# local-only testing. Sign-in with Google simply won't work until real credentials are supplied.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
