
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema (migrations in classpath:db/migration, its default location — no extra
# config needed); Hibernate only validates entities against it at startup, never generates or
# alters DDL itself. open-in-view is disabled per Spring Boot's own best-practice recommendation
# (avoids the "Open Session In View" anti-pattern).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT ---
# No defaults here on purpose: every value below must come from the environment.
# For local development, activate the "dev" profile instead (application-dev.properties),
# which supplies safe local-only defaults, e.g.:
#   SPRING_PROFILES_ACTIVE=dev ./mvnw spring-boot:run
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}
app.jwt.mfa-token-expiration=${JWT_MFA_TOKEN_EXPIRATION}
app.jwt.issuer=${JWT_ISSUER}

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Email verification ---
app.email-verification.verification-base-url=${EMAIL_VERIFICATION_BASE_URL}
app.email-verification.token-expiration=${EMAIL_VERIFICATION_TOKEN_EXPIRATION}

# --- Outbound mail (SMTP) ---
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from-address=${MAIL_FROM_ADDRESS}

# --- Google OAuth2 login ---
# Create OAuth 2.0 credentials at https://console.cloud.google.com/apis/credentials
# (redirect URI: <this app's base URL>/login/oauth2/code/google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI}
