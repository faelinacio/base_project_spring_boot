
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Liquibase owns the schema; Hibernate only validates entities against it at startup, never
# generates or alters DDL itself. open-in-view is disabled per Spring Boot's own best-practice
# recommendation (avoids the "Open Session In View" anti-pattern).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT ---
# No defaults here on purpose: every value below must come from the environment.
# For local development, activate the "dev" profile instead (application-dev.properties),
# which supplies safe local-only defaults, e.g.:
#   SPRING_PROFILES_ACTIVE=dev ./mvnw spring-boot:run
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}
app.jwt.issuer=${JWT_ISSUER}

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
